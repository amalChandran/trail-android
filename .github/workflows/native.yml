name: Native libraries
on: [push, pull_request]
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - run: python3 ../scripts/sync-examples.py --check
      - run: python3 ../scripts/generate-contract-fixtures.py --check
      - run: python3 ../scripts/generate-vehicle-artwork.py --check
      - run: python3 ../scripts/sync-fixtures.py --check
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - run: ./gradlew :trail-core:test :trail-effects:test :sample-plugin:test :playground:assembleDebug :playground:assembleDebugAndroidTest :playground:lintDebug --console=plain
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-trail-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: false
          script: ./scripts/test-android-ui.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-reports
          path: |
            android/**/build/reports
            artifacts/android-instrumentation.*
  swift:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/sync-examples.py --check
      - run: python3 scripts/generate-contract-fixtures.py --check
      - run: python3 scripts/generate-vehicle-artwork.py --check
      - run: python3 scripts/sync-fixtures.py --check
      - run: ./scripts/test-swift.sh
      - run: ./scripts/test-ios.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: swift-native-reports
          path: |
            artifacts/*tests.*
            ios/build/*.xcresult
